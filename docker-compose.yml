services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: social-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: dockerfile
    container_name: social-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
    command: ["npm", "run", "worker"]

services:
  api:
    build: .
    container_name: social-api
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: 3000
    depends_on:
      - mongodb
    volumes:
      - .:/app
    command: npm run dev

  worker:
    build: .
    container_name: social-worker
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
    command: npm run worker

  redis:
    image: redis:7-alpine
    container_name: social-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:8
    container_name: social-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
services:
  api:
    build: .
    container_name: social-api

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mongodb

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  mongodb:
    image: mongo:8
    container_name: social-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: